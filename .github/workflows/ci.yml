name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The LSP suite spawns the binary, so it has to exist first.
      - run: cargo build --release
      - run: cargo test
      # The Python suite drives the release binary the way a user does. The
      # parts that need q skip themselves when it is not installed, which on
      # this runner it is not; the CLI tests run regardless. It went unrun
      # here once, and a failing test sat unnoticed for a release.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npx tsc -p ./ --noEmit
      # The grammar, tokenized by VS Code's own engine against pinned scopes.
      - run: npm test
