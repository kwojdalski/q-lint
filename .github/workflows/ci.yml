name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The LSP suite spawns the binary, so it has to exist first.
      - run: cargo build --release
      - run: cargo test
      # The Python suite drives the release binary the way a user does. The
      # parts that need q skip themselves when it is not installed, which on
      # this runner it is not; the CLI tests run regardless. It went unrun
      # here once, and a failing test sat unnoticed for a release.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest -q tests/
      # Findings must not move when line endings, position or a trailing
      # comment do, which no case can check. Over the q in this tree - every
      # case and example - since the corpus it was written for is not here.
      - run: python scripts/check_invariance.py target/release/qlinter examples tests/corpus tests/cases
  # The oldest compiler Cargo.toml's rust-version promises, so the promise is
  # checked rather than remembered: a newer std API or language feature
  # fails here, not on a user's older toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
  # The tests on the other platforms the release builds for. Windows in
  # particular: its paths are drive letters and backslashes, and its file URIs
  # file:///c%3A/..., and a path bug there once surfaced only as a release
  # job that hung.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test
  # The reusable action, run from this checkout as a user's workflow runs it:
  # a clean file passes, and the examples' findings fail the step. Text, not
  # the action's default github format, until a release has that (#1146);
  # the pinned version is any published one, since only the action is new.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf 'f:{[a] a+1}\n' > "$RUNNER_TEMP/clean.q"
      - uses: ./
        with:
          version: 0.33.2
          format: text
          paths: ${{ runner.temp }}/clean.q
      - uses: ./
        id: examples
        continue-on-error: true
        with:
          version: 0.33.2
          format: text
          paths: examples
      - name: The examples' findings fail the action
        if: steps.examples.outcome != 'failure'
        run: |
          echo "qlinter passed examples/, which holds deliberate findings" >&2
          exit 1
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npx tsc -p ./ --noEmit
      # The grammar, tokenized by VS Code's own engine against pinned scopes.
      - run: npm test
      # Packaged on every PR, so a manifest or .vscodeignore mistake fails
      # here rather than in the release a tag starts. The neutral build: no
      # server inside, as the release's platform-neutral vsix has none.
      - run: npm run compile
      - run: npx --yes @vscode/vsce package --out qlinter-ci.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/qlinter-ci.vsix
          if-no-files-found: error
  # The Python wheel, built as pip builds it - through pyproject.toml's
  # maturin backend - and checked to carry the executable, which is the
  # whole of what it is for.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel --outdir dist
      - run: unzip -l dist/*.whl | grep -E '\.data/scripts/qlinter$'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
