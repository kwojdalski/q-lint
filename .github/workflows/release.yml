name: Release

# Tag-driven, so cutting a release is `git tag v0.1.0 && git push --tags` and
# nothing else. The binaries are built by the same CI that gates every commit,
# on the platforms they target - cross-compiling four targets from one
# developer machine is how a release ends up containing something nobody ran.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: version matches the tag
    runs-on: ubuntu-latest
    # Nothing downstream is worth building if the tag and the sources disagree
    # about what is being released. A vsix whose manifest declares the version
    # already installed is a no-op VS Code has no reason to notice, and the
    # assets are named from the tag, so nothing else would give it away.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The same gates CI applies to a commit. Without them a tag can ship
      # from a commit CI has already rejected, since the platform legs run
      # only the tests.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Compare
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            got=$(sed -n "$2" "$1")
            if [ "$got" != "$want" ]; then
              echo "$1 declares '$got', tag says '$want'" >&2
              fail=1
            fi
          }
          check Cargo.toml                 's/^version = "\(.*\)"/\1/p;'
          check pyproject.toml             's/^version = "\(.*\)"/\1/p;'
          check editors/vscode/package.json 's/^  "version": "\(.*\)",/\1/p;'
          exit $fail

  binaries:
    needs: [version]
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform is attempted even when one fails, so a broken Windows
      # build does not hide whether Linux and macOS were fine.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The tests run here too, not just in CI: a tagged build that was never
      # exercised on the platform it targets is the one that ships broken.
      - run: cargo test --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="qlinter-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/qlinter.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/qlinter" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  extension:
    name: vsix ${{ matrix.vscode || 'any' }}
    # After the binaries, because each platform build packages the matching
    # one: an extension that carries its own server is an extension nobody has
    # to put on PATH, which was the single commonest way this failed.
    needs: [binaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vscode: darwin-arm64, target: aarch64-apple-darwin }
          - { vscode: darwin-x64, target: x86_64-apple-darwin }
          - { vscode: linux-x64, target: x86_64-unknown-linux-gnu }
          - { vscode: win32-x64, target: x86_64-pc-windows-msvc }
          # No target: the platform-neutral build for anything not listed
          # above. It carries no server and falls back to PATH, which is what
          # the Marketplace serves a platform it has no build for.
          - { vscode: "", target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v4
        if: matrix.target != ''
        with:
          name: ${{ matrix.target }}
          path: server-archive
      - name: Unpack the server for this platform
        if: matrix.target != ''
        run: |
          set -euo pipefail
          # Start from empty. `editors/vscode/server/` arrives from the
          # checkout holding a darwin-arm64 binary, and on macOS and Linux the
          # unpacked one happens to overwrite it because the filename matches.
          # Windows names its binary `qlinter.exe`, so it landed alongside and
          # the win32 vsix shipped a Mach-O binary it could never run.
          rm -rf editors/vscode/server
          mkdir -p editors/vscode/server
          cd server-archive
          if ls *.zip >/dev/null 2>&1; then
            unzip -q -o ./*.zip
          else
            tar xzf ./*.tar.gz
          fi
          # The archive holds a single directory named for the tag and target.
          found=$(find . -type f \( -name qlinter -o -name qlinter.exe \) | head -1)
          test -n "$found" || { echo "no qlinter in the archive" >&2; exit 1; }
          install -m 755 "$found" "../editors/vscode/server/$(basename "$found")"
      - name: Drop the committed server from the platform-neutral build
        if: matrix.target == ''
        # `editors/vscode/server/` holds a checked-in darwin-arm64 binary for
        # local packaging. The platform-neutral vsix goes to machines this
        # matrix does not cover, so shipping one platform's binary in it would
        # be worse than shipping none: the extension would prefer a server
        # that cannot run. The platform legs overwrite it with their own.
        run: rm -rf editors/vscode/server
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          npm ci
          npm run compile
          if [ -n "${{ matrix.vscode }}" ]; then
            npx --yes @vscode/vsce package --target "${{ matrix.vscode }}" \
              --out "qlinter-${GITHUB_REF_NAME}-${{ matrix.vscode }}.vsix"
          else
            npx --yes @vscode/vsce package --out "qlinter-${GITHUB_REF_NAME}.vsix"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode || 'any' }}
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    needs: [binaries, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --generate-notes gives the commit list; the prose above it says
          # what the thing IS and which of nine files to download, which a
          # list of commits never does.
          sed "s/VERSION/${GITHUB_REF_NAME}/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "qlinter $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            $(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' \) -print)

  marketplace:
    name: marketplace
    # After the release, so a tag that failed to produce binaries does not put
    # an extension on the Marketplace pointing at downloads that do not exist.
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          # Skipping rather than failing: the Marketplace is one distribution
          # channel for this tag, not the definition of a successful release.
          # A fork, or this repository before the token exists, still releases.
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT is not set - skipping the Marketplace publish." >&2
            exit 0
          fi
          # Every platform build plus the neutral one, in a single publish so
          # the Marketplace serves each user the one that matches their machine.
          npx --yes @vscode/vsce publish --packagePath vsix/*.vsix
