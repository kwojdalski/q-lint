<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <!-- q-lint's extension icon: the activity-bar mark (media/q-lint.svg) on a
       tile. Our own drawing of a lowercase q with a lint squiggle; not KX's
       logo. icon.png is this file rendered at 256x256, e.g.
       `rsvg-convert -w 256 -h 256 media/icon.svg -o icon.png`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3b5c"/>
      <stop offset="1" stop-color="#0b1622"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="21">
      <stop offset="0" stop-color="#7cf5cf"/>
      <stop offset="1" stop-color="#2fc7a0"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5" fill="url(#tile)"/>
  <g transform="translate(2.6 2.4) scale(0.78)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4">
    <circle cx="12.5" cy="9" r="5.5" stroke="url(#glyph)"/>
    <path d="M18 3.5V21" stroke="url(#glyph)"/>
    <path d="M4.5 19.5c1.25-2 2.5-2 3.75 0s2.5 2 3.75 0" stroke="#f7a541"/>
  </g>
</svg>
