[package]
name = "q-lint-rs"
version = "0.37.0"
edition = "2024"
# The oldest compiler that builds it: `if let ... && let ...` chains, which
# edition 2024 has only from 1.88. CI's msrv job builds with exactly this.
rust-version = "1.88"
description = "A linter and language server for q/kdb+ source that never executes what it reads"
license = "MIT"
repository = "https://github.com/kwojdalski/q-lint"
readme = "README.md"
keywords = ["q", "kdb", "linter", "lsp", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "qlinter"
path = "src/main.rs"

[dependencies]
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
glob = "0.3"
walkdir = "2.5"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"

[dev-dependencies]
iri-string = "0.7.12"
